{% extends "base.html" %}{% block content %}<h2>My certificates</h2><ul>{% for certificate in certificates %}<li>{{ certificate.enrollment.course.title }} - {{ certificate.certificate_id }} <a href="{% url 'certificates:download' certificate.pk %}">Download PDF</a> <a href="{% url 'certificates:verify' certificate.certificate_id %}">Verify</a></li>{% empty %}<li>No certificates issued.</li>{% endfor %}</ul>{% endblock %}
