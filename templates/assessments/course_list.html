{% extends "base.html" %}{% block content %}<h2>Questionnaires: {{ course.title }}</h2>
<p><a href="{% url 'assessments:create' course.pk %}">Create questionnaire</a></p>
<ul>{% for quiz in questionnaires %}<li><a href="{% url 'assessments:manage_detail' quiz.pk %}">{{ quiz.title }}</a> - {{ quiz.opens_at }} to {{ quiz.deadline }}</li>{% empty %}<li>No questionnaires.</li>{% endfor %}</ul>{% endblock %}
