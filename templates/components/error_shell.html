<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block error_title %}{% endblock %} | Capacity Connect</title>
    {% include "components/assets.html" %}
</head>
<body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header class="site-header"><div class="shell header-bar">Capacity Connect</div></header>
    <main id="main" class="shell error-layout" tabindex="-1">
        <p class="eyebrow">Service notice</p>
        <h1>{% block error_heading %}{% endblock %}</h1>
        <p>{% block error_message %}{% endblock %}</p>
        <a class="button" href="/">Return to home</a>
    </main>
    <footer><div class="shell">&copy; Capacity Connect</div></footer>
</body>
</html>
