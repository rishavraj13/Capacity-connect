{% if form.errors %}
<section class="alert alert-error" role="alert" tabindex="-1" data-error-summary>
    <p><strong>Check the form and try again.</strong></p>
    {{ form.non_field_errors }}
    <ul>
        {% for field in form %}
            {% if field.errors %}
                <li>
                    <a href="#{{ field.id_for_label }}">{{ field.label }}</a>
                    {% for error in field.errors %}<span> — {{ error }}</span>{% endfor %}
                </li>
            {% endif %}
        {% endfor %}
    </ul>
</section>
{% endif %}
