{% extends "base.html" %}

{% block title %}Login - Capacity Connect{% endblock %}

{% block content %}
<section class="card auth-card">
    <h1>Portal Login</h1>
    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        {% if request.GET.next %}
            <input type="hidden" name="next" value="{{ request.GET.next }}">
        {% endif %}
        {% include "components/form_fields.html" %}
        <div>
            <button type="submit" id="submit-login">Log In</button>
        </div>
    </form>
    <p>Need an account? <a href="{% url 'signup' %}">Sign up here</a>.</p>
</section>
{% endblock %}
