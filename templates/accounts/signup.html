{% extends "base.html" %}

{% block title %}Sign Up - Capacity Connect{% endblock %}

{% block content %}
<section class="card auth-card">
    <h1>Sign Up for Capacity Connect</h1>
    <form method="post" action="{% url 'signup' %}">
        {% csrf_token %}
        {% include "components/form_fields.html" %}
        <div>
            <button type="submit" id="submit-signup">Register Account</button>
        </div>
    </form>
    <p>Already registered? <a href="{% url 'login' %}">Login here</a>.</p>
</section>
{% endblock %}
