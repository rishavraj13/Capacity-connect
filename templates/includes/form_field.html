<div class="form-field-group">
    <label for="{{ field.id_for_label }}">
        {{ field.label }}
        {% if field.field.required %}<span>*</span>{% endif %}
    </label>
    {{ field }}
    {% if field.help_text %}
        <small id="{{ field.id_for_label }}_help">{{ field.help_text }}</small>
    {% endif %}
    {% if field.errors %}
        <ul class="errorlist" id="{{ field.id_for_label }}_errors">
            {% for error in field.errors %}
                <li>{{ error }}</li>
            {% endfor %}
        </ul>
    {% endif %}
</div>
